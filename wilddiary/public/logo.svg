<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Open book pages - right page -->
  <path d="M100 155 C100 155 155 148 170 130 L175 60 C160 75 110 80 100 85 Z" 
        fill="white" stroke="#1a0099" stroke-width="5" stroke-linejoin="round"/>
  <!-- Open book pages - left page -->
  <path d="M100 155 C100 155 45 148 30 130 L25 60 C40 75 90 80 100 85 Z" 
        fill="white" stroke="#1a0099" stroke-width="5" stroke-linejoin="round"/>
  <!-- Book spine -->
  <path d="M100 85 L100 155" stroke="#1a0099" stroke-width="4" stroke-linecap="round"/>
  <!-- Back left page -->
  <path d="M28 68 C28 68 20 130 25 135" stroke="#1a0099" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Back right page -->
  <path d="M172 68 C172 68 180 130 175 135" stroke="#1a0099" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Book bottom curve left -->
  <path d="M25 135 C35 150 65 160 100 155" stroke="#1a0099" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Book bottom curve right -->
  <path d="M175 135 C165 150 135 160 100 155" stroke="#1a0099" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Pencil body -->
  <rect x="131" y="28" width="12" height="65" rx="2" 
        transform="rotate(-35 137 60)" fill="#40e0d0" stroke="#2ab0a0" stroke-width="1.5"/>
  <!-- Pencil eraser -->
  <rect x="131" y="20" width="12" height="10" rx="2"
        transform="rotate(-35 137 25)" fill="#ff8080" stroke="#cc6060" stroke-width="1"/>
  <!-- Pencil tip -->
  <path d="M125 88 L118 105 L132 95 Z" fill="#2ab0a0"/>
  <!-- Pencil tip point -->
  <path d="M118 105 L125 101" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eraser band -->
  <rect x="131" y="30" width="12" height="4"
        transform="rotate(-35 137 32)" fill="#2a2a2a" opacity="0.5"/>
</svg>
