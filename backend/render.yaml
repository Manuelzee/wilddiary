services:
  - type: web
    name: wilddiary-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://wilddiary.pages.dev,https://wilddiary-social.netlify.app,https://wilddiary.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Wild Diary <onboarding@resend.dev>

