services:
  - type: web
    name: wilddiary-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_PATH
        value: /app/wilddiary.db
      - key: CORS_ORIGINS
        value: https://wilddiary-social.netlify.app,https://wilddiary.netlify.app
      - key: JWT_SECRET
        generateValue: true
